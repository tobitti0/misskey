name: Publish Docker image (mtn)

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-mtn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.repository == 'tobitti0/misskey'
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=ref,event=branch
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push to GitHub Container Registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:mtn-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:mtn-buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
